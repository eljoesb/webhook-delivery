[package]
name = "webhook-delivery"
version = "1.0.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["json"] }
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
hmac = "0.13.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "chrono", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
axum = { version = "0.8.9", features = ["json"] }
chrono = { version = "0.4.45" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "chrono", "json"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.29.0", features = ["v4"] }
